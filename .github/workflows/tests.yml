name: Run Tests


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estoque_user
          POSTGRES_PASSWORD: estoque_pass123
          POSTGRES_DB: estoque_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        env:
          DATABASE_URL: postgresql://estoque_user:estoque_pass123@localhost:5432/estoque_test_db
          TEST_DATABASE_URL: postgresql://estoque_user:estoque_pass123@localhost:5432/estoque_test_db
        run: pytest -v