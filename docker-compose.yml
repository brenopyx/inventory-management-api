services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  api:
    build: .

    environment:
      DATABASE_URL: ${DB_URL}

    ports:
      - "8000:8000"

    depends_on:
      - db

volumes:
  postgres_data: