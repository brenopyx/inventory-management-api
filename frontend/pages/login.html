<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | Stock System - Padaria Central</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>

<body class="login-page">
  <main class="login-shell">
    <div class="brand">
      <div class="brand-mark">🥖</div>
      <h1>Stock System</h1>
      <p>Padaria Central</p>
    </div>
    <section class="card login-card" aria-labelledby="login-title">
      <h2 id="login-title" class="card-title">Acesse sua conta</h2>
      <p class="helper-text">Informe suas credenciais para gerenciar o estoque.</p>
      <form id="login-form" action="dashboard.html">
        <div class="form-group"><label for="email">E-mail</label><input class="form-control" id="email" type="email"
            placeholder="Email" required /></div>
        <div class="form-group"><label for="senha">Senha</label><input class="form-control" id="senha" type="password"
            placeholder="Senha" required /></div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p id="error-message" class="error-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module" src="../js/login.js"></script>
</body>

</html>
