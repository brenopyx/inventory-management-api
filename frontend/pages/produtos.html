<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos | Stock System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">🥖</div>
                <h1>Stock System</h1>
                <p>Padaria Central</p>
            </div>
            <nav class="nav-links"><a href="dashboard.html"><span class="nav-icon">▦</span>Dashboard</a><a
                    href="categorias.html"><span class="nav-icon">▤</span>Categorias</a><a class="active"
                    href="produtos.html"><span class="nav-icon">▣</span>Produtos</a><a href="movimentacoes.html"><span
                        class="nav-icon">↔</span>Movimentações</a></nav>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <h2>Produtos</h2>
                <div class="user-area"><span>Olá, Administrador</span><a class="btn btn-outline btn-small"
                        href="login.html">Sair</a></div>
            </header>
            <section class="page-content">
                <div class="page-intro">
                    <h3>Cadastro de produtos</h3>
                    <p>Adicione e mantenha os itens vendidos e utilizados pela padaria.</p>
                </div>
                <div class="page-grid">
                    <section class="card">
                        <h4 class="card-title">Novo produto</h4>
                        <form id="product-form">
                            <div class="form-group"><label for="product-name">Nome</label><input class="form-control"
                                    id="product-name" placeholder="Ex.: Pão francês" required /></div>
                            <div class="form-row">
                                <div class="form-group"><label for="product-price">Preço</label><input
                                        class="form-control" id="product-price" type="number" step="0.01" min="0"
                                        placeholder="0,00" required /></div>
                                <div class="form-group"><label for="product-category">Categoria</label><select
                                        class="form-control" id="product-category" required>
                                        <option value="">Selecione</option>
                                    </select></div>
                            </div>
                            <div class="form-group"><label for="product-description">Descrição
                                    <small>(opcional)</small></label><textarea class="form-control"
                                    id="product-description" placeholder="Detalhes do produto"></textarea></div>
                            <div class="form-actions"><button class="btn btn-primary" type="submit">Criar
                                    produto</button></div>
                        </form>
                    </section>
                    <section class="card table-card">
                        <div class="table-header">
                            <h4>Produtos cadastrados</h4>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Preço</th>
                                        <th>Categoria</th>
                                        <th>Descrição</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela-produtos-lista">

                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="../js/produtos.js"></script>
</body>

</html>
